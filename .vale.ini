StylesPath = .github/styles

# MinAlertLevel = suggestion

Packages = RedHat, proselint, https://github.com/Open-Paws/vale-no-animal-violence/releases/latest/download/NoAnimalViolence.zip
Vocab = FluxNinja

IgnoredScopes = dt, code, tt, codeblock, a

[*.md]
BasedOnStyles = Vale, RedHat, proselint, NoAnimalViolence

# TokenIgnores explicit anchors e.g. {#anchor}
TokenIgnores = \{#[^}]+\}

[formats]
mdx = md
